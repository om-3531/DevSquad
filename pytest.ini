[pytest]
asyncio_mode = auto
python_files = test_*.py
norecursedirs = .git .venv venv frontend backend .pytest-tmp*
addopts = --ignore=test_coder.py --ignore=test_groq.py --ignore=.pytest_cache --ignore=.pytest-tmp -p no:cacheprovider
markers =
    integration: requires a running local Docker daemon and is not part of deterministic unit testing
